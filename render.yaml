services:
  # The ADK agent. Docker rather than the python runtime because the agent is
  # started by `adk api_server`, not a plain uvicorn entrypoint.
  - type: web
    name: reltek-agent
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /list-apps
    envVars:
      - key: GCP_PROJECT_ID
        value: smartsuitebigqueryproject

      # Synthetic demo data only. Never point this at smartsuite_chris:
      # the deployment is public and unauthenticated.
      - key: BIGQUERY_DATASET
        value: smartsuite_demo

      # Secrets: set these in the Render dashboard, never in this file.
      #   GOOGLE_API_KEY                      - from aistudio.google.com/app/apikey
      #   GOOGLE_APPLICATION_CREDENTIALS_JSON - the bq-demo-reader key, pasted whole
      - key: GOOGLE_API_KEY
        sync: false
      - key: GOOGLE_APPLICATION_CREDENTIALS_JSON
        sync: false

  # The chat UI. A thin Express proxy plus static files - no domain logic.
  # The chat UI is no longer here. ui/public is a static page deployed to
  # Netlify, matching the other demos, and it calls the agent above directly.
  # ui/server.js is kept only as a local-dev convenience.
